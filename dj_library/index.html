<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音ゲーDJ Library</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 16px 50px}
a{color:#9ecbff}.home{display:inline-block;background:#333;color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;margin-bottom:20px}
.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:20px;margin-bottom:20px}
h1{margin:0 0 8px}.sub,.small{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}label{display:block;font-size:14px;color:#ccc;margin-bottom:6px}
input,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #444;background:#101010;color:#eee;font-size:15px}textarea{min-height:90px;resize:vertical}
button{padding:11px 16px;border:0;border-radius:8px;background:#eee;color:#111;font-weight:bold;cursor:pointer}button.secondary{background:#333;color:#eee}button.danger{background:#642323;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.suggestion{padding:7px 10px;border:1px solid #444;border-radius:999px;background:#222;color:#ddd;font-size:13px;font-weight:600}.suggestion:hover{background:#333}.suggestion-label{font-size:12px;color:#777;margin-right:2px;align-self:center}
.hidden{display:none}.msg{margin-top:12px;color:#bbb;white-space:pre-wrap}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.songs{display:grid;gap:12px}.song{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;background:#171717;border:1px solid #333;border-radius:12px;padding:12px}
.thumb{width:90px;height:65px;object-fit:cover;border-radius:8px;background:#292929}.title{font-size:18px;font-weight:bold}.meta{font-size:13px;color:#aaa;line-height:1.7}.memo{margin-top:6px;white-space:pre-wrap}
@media(max-width:750px){.grid,.filters{grid-template-columns:1fr}.song{grid-template-columns:70px 1fr}.song .song-actions{grid-column:1/-1}.thumb{width:70px;height:55px}}

  .search-links{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    align-items:center;
    margin-top:8px;
}

.search-btn{
    padding:7px 11px;
    border:1px solid #444;
    border-radius:999px;
    background:#222;
    color:#ddd;
    font-size:13px;
    font-weight:600;
}

.search-btn:hover{
    background:#333;
}

.tag-container{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:8px;
    min-height:0;
}

.tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:999px;
    background:#2a2a2a;
    border:1px solid #555;
    font-size:14px;
}

.tag-remove{
    border:none;
    background:transparent;
    color:#aaa;
    cursor:pointer;
    padding:0;
    font-size:14px;
}

.tag-remove:hover{
    color:#fff;
}

.tag-input-row{
    display:flex;
    gap:8px;
}

.tag-input-row input{
    flex:1;
    min-width:0;
}

.tag-add-btn{
    width:42px;
    flex-shrink:0;
}
  
</style>
</head>
<body><div class="wrap">
<a class="home" href="../">🏠 ホームに戻る</a>

<section id="auth" class="card">
<h1>🎧 音ゲーDJ Library</h1><p class="sub">音ゲーDJ向け 楽曲ライブラリ</p>
<div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"></div>
<div class="actions"><button id="login">ログイン</button><button id="signup" class="secondary">アカウント作成</button></div>
<div id="authMsg" class="msg"></div>
</section>

<section id="app" class="hidden">
<div class="top"><div><h1>🎧 My DJ Library</h1><div id="who" class="small"></div></div><button id="logout" class="secondary">ログアウト</button></div>

<section class="card"><h2 id="formTitle">＋ 曲を追加</h2>
<form id="form"><input id="songId" type="hidden">
<div class="grid">
<div class="field">
    <label>曲名 *</label>
    <input id="title" required>

    <div class="search-links">
    <span>🔎 検索：</span>
    <button type="button" class="search-btn" onclick="searchYouTube()">YouTube</button>
    <button type="button" class="search-btn" onclick="searchGoogle()">Google</button>
    <button type="button" class="search-btn" onclick="searchWiki()">Wiki</button>
</div>
</div>
<div class="field tag-field">
    <label>作曲者・アーティスト</label>

    <div id="artistTags" class="tag-container"></div>

    <div class="tag-input-row">
        <input id="artistInput" maxlength="20" placeholder="タグを入力">
        <button type="button" class="tag-add-btn" onclick="addTag('artist')">＋</button>
    </div>

    <div id="artistSuggestions" class="suggestions"></div>
</div>

<div class="field tag-field">
    <label>原作音ゲー</label>

    <div id="gameTags" class="tag-container"></div>

    <div class="tag-input-row">
        <input id="gameInput" maxlength="20" placeholder="タグを入力">
        <button type="button" class="tag-add-btn" onclick="addTag('game')">＋</button>
    </div>

    <div id="gameSuggestions" class="suggestions"></div>
</div>

<div class="field tag-field">
    <label>ジャンル</label>

    <div id="genreTags" class="tag-container"></div>

    <div class="tag-input-row">
        <input id="genreInput" maxlength="20" placeholder="タグを入力">
        <button type="button" class="tag-add-btn" onclick="addTag('genre')">＋</button>
    </div>

    <div id="genreSuggestions" class="suggestions"></div>
</div>
<div class="field"><label>BPM 最小</label><input id="bpmMin" type="number" step="0.01" min="0"></div>
<div class="field"><label>BPM 最大</label><input id="bpmMax" type="number" step="0.01" min="0"></div>
<div class="field"><label>長さ（秒）</label><input id="duration" type="number" step="0.01" min="0"></div>
<div class="field"><label>リンク</label><input id="url" type="url" placeholder="https://..."></div>
</div>
<div class="field"><label>サムネイルURL</label><input id="thumbnail" type="url"></div>
<div class="field tag-field">
    <label>メモタグ</label>

    <div id="memoTags" class="tag-container"></div>

    <div class="tag-input-row">
        <input id="memoInput" maxlength="20" placeholder="高速・盛り上がる・繋ぎやすい など">
        <button type="button" class="tag-add-btn" onclick="addTag('memo')">＋</button>
    </div>

    <div id="memoSuggestions" class="suggestions"></div>
</div>

<div class="field">
    <label>詳細メモ</label>
    <textarea id="memo" placeholder="展開、つなぎ方、雰囲気などを自由に入力"></textarea>
</div>
<div class="actions"><button id="save">保存</button><button type="button" id="cancel" class="secondary hidden">編集をキャンセル</button></div>
<div id="songMsg" class="msg"></div>
</form></section>

<section class="card"><h2>🔍 楽曲検索・絞り込み</h2>
<div class="filters"><input id="search" placeholder="曲名・アーティスト・メモ"><input id="fgame" placeholder="原作音ゲー"><input id="fgenre" placeholder="ジャンル"><input id="fbpm" type="number" placeholder="BPMを含む"></div>
<div id="count" class="small"></div></section>
<div id="songs" class="songs"></div><div id="listMsg" class="msg"></div>
</section>
</div>

<script>
const SUPABASE_URL="https://dgoolyfopsrgxsjyqzgp.supabase.co";
const KEY="sb_publishable_uq3wW_lvkxX8eGU08bplgA_v4ESvZWb";
const db=supabase.createClient(SUPABASE_URL,KEY), $=id=>document.getElementById(id);
let songs=[];

let tagState = {
    artist: [],
    game: [],
    genre: [],
    memo: []
};

function renderTags(type){
    const box = $(type + "Tags");
    box.innerHTML = "";

    tagState[type].forEach((tag, index) => {
        const el = document.createElement("span");
        el.className = "tag";

        const text = document.createElement("span");
        text.textContent = tag;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "tag-remove";
        remove.textContent = "×";
        remove.onclick = () => {
            tagState[type].splice(index, 1);
            renderTags(type);
            buildAllSuggestions();
        };

        el.append(text, remove);
        box.append(el);
    });
}

function addTag(type){
    const input = $(type + "Input");
    const value = input.value.trim();

    if(!value) return;

    if(value.length > 20){
        return msg("songMsg", "タグは20文字以内にしてください。");
    }

    if(tagState[type].includes(value)){
        input.value = "";
        return;
    }

    tagState[type].push(value);
    input.value = "";

    renderTags(type);
    buildAllSuggestions();
}

function clearTags(){
    tagState = {
        artist: [],
        game: [],
        genre: [],
        memo: []
    };

    ["artist","game","genre","memo"].forEach(renderTags);
}

["artist","game","genre","memo"].forEach(type => {
    $(type + "Input").addEventListener("keydown", e => {
        if(e.key === "Enter"){
            e.preventDefault();
            addTag(type);
        }
    });
});

function searchWiki(){
    const title = $("title").value.trim();

    if(!title){
        return msg("songMsg","まず曲名を入力してください。");
    }

    let query = title;

    // 現在入力中の原作音ゲータグを検索条件に追加
    if(tagState.game.length){
        query += " " + tagState.game.join(" ");
    }else{
        query += " 音ゲー";
    }

    query += " Wiki";

    window.open(
        "https://www.google.com/search?q=" + encodeURIComponent(query),
        "_blank"
    );
}

function searchYouTube(){
    const title=$("title").value.trim();
    if(!title){
        return msg("songMsg","まず曲名を入力してください。");
    }

    window.open(
        "https://www.youtube.com/results?search_query="+encodeURIComponent(title),
        "_blank"
    );
}

function searchGoogle(){
    const title=$("title").value.trim();
    if(!title){
        return msg("songMsg","まず曲名を入力してください。");
    }

    window.open(
        "https://www.google.com/search?q="+encodeURIComponent(title),
        "_blank"
    );
}



function msg(id,t){$(id).textContent=t||""}
function bpmText(a,b){if(a==null&&b==null)return"BPM -";if(a==null)return`BPM ～${b}`;if(b==null)return`BPM ${a}～`;return Number(a)===Number(b)?`BPM ${a}`:`BPM ${a}–${b}`}
function duration(s){if(s==null||s==="")return"";s=Math.round(Number(s));return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function buildSuggestions(type){
    const field = type + "_tags";
    const inputId = type + "Input";
    const boxId = type + "Suggestions";

    const counts = new Map();
    const latest = new Map();

    songs.forEach((s, i) => {
        const values = Array.isArray(s[field]) ? s[field] : [];

        values.forEach(v => {
            const value = String(v).trim();
            if(!value) return;

            const key = value.toLowerCase();

            counts.set(key, (counts.get(key) || 0) + 1);

            if(!latest.has(key)){
                latest.set(key, {
                    value: value,
                    index: i
                });
            }
        });
    });

    const typed = $(inputId).value.trim().toLowerCase();

    const items = [...counts.keys()]
        .map(key => ({
            key,
            value: latest.get(key).value,
            count: counts.get(key),
            index: latest.get(key).index
        }))
        .filter(x =>
            !typed ||
            x.value.toLowerCase().includes(typed)
        )
        .sort((a,b) =>
            b.count - a.count ||
            a.index - b.index ||
            a.value.localeCompare(b.value)
        )
        .slice(0, 12);

    const box = $(boxId);
    box.innerHTML = "";

    if(!items.length) return;

    const label = document.createElement("span");
    label.className = "suggestion-label";
    label.textContent = "過去の入力：";

    box.append(label);

    items.forEach(x => {
        const btn = document.createElement("button");

        btn.type = "button";
        btn.className = "suggestion";
        btn.textContent = x.value;

        btn.onclick = () => {
            if(!tagState[type].includes(x.value)){
                tagState[type].push(x.value);
                renderTags(type);
            }

            $(inputId).value = "";
            buildAllSuggestions();
        };

        box.append(btn);
    });
}
function buildAllSuggestions(){
    buildSuggestions("artist");
    buildSuggestions("game");
    buildSuggestions("genre");
    buildSuggestions("memo");
}

async function ui(){let{data:{session}}=await db.auth.getSession();if(session){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent="ログイン中："+(session.user.email||"");load()}else{$("auth").classList.remove("hidden");$("app").classList.add("hidden")}}
$("login").onclick=async()=>{msg("authMsg","");let e=$("email").value.trim(),p=$("password").value;if(!e||!p)return msg("authMsg","メールアドレスとパスワードを入力してください。");let{error}=await db.auth.signInWithPassword({email:e,password:p});if(error)return msg("authMsg","ログイン失敗："+error.message);ui()}
$("signup").onclick=async()=>{msg("authMsg","");let e=$("email").value.trim(),p=$("password").value;if(!e||!p)return msg("authMsg","メールアドレスとパスワードを入力してください。");if(p.length<6)return msg("authMsg","パスワードは6文字以上にしてください。");let{data,error}=await db.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.href}});if(error)return msg("authMsg","アカウント作成失敗："+error.message);msg("authMsg",data.session?"アカウントを作成しました！":"確認メールを送信しました。メール内のリンクから確認してください。");if(data.session)ui()}
$("logout").onclick=async()=>{await db.auth.signOut();$("form").reset();resetEdit();ui()}
db.auth.onAuthStateChange(()=>ui());

$("form").onsubmit = async ev => {
    ev.preventDefault();

    console.log("保存ボタンが押されました");

    msg("songMsg", "保存処理中...");

    let { data: { user } } = await db.auth.getUser();

    console.log("ユーザー:", user);

    if(!user){
        return msg("songMsg", "ログインしてください。");
    }

    const id = $("songId").value;

    const a = $("bpmMin").value === ""
        ? null
        : Number($("bpmMin").value);

    const b = $("bpmMax").value === ""
        ? null
        : Number($("bpmMax").value);

    if(a != null && b != null && a > b){
        return msg(
            "songMsg",
            "BPM最小値は最大値以下にしてください。"
        );
    }

    const song = {
        title: $("title").value.trim(),

        // タグ
        artist_tags: [...tagState.artist],
        game_tags: [...tagState.game],
        genre_tags: [...tagState.genre],
        memo_tags: [...tagState.memo],

        bpm_min: a,
        bpm_max: b,

        duration: $("duration").value === ""
            ? null
            : Number($("duration").value),

        // 詳細メモ
        memo: $("memo").value.trim() || null,

        url: $("url").value.trim() || null,
        thumbnail: $("thumbnail").value.trim() || null
    };

    let r;

    if(id){
        r = await db
            .from("songs")
            .update(song)
            .eq("id", id)
            .eq("user_id", user.id);
    }else{
        r = await db
            .from("songs")
            .insert({
                ...song,
                user_id: user.id
            });
    }

    if(r.error){
        return msg(
            "songMsg",
            "保存失敗：" + r.error.message
        );
    }

    msg(
        "songMsg",
        id ? "更新しました！" : "保存しました！"
    );

    $("form").reset();
    clearTags();
    resetEdit();

    load();
};

function resetEdit(){
    $("songId").value = "";
    $("formTitle").textContent = "＋ 曲を追加";
    $("save").textContent = "保存";
    $("cancel").classList.add("hidden");
}

$("cancel").onclick = () => {

    $("form").reset();

    clearTags();

    resetEdit();

    msg("songMsg", "");
};

async function load(){let{data,error}=await db.from("songs").select("*").order("created_at",{ascending:false});if(error){songs=[];return msg("listMsg","楽曲取得失敗："+error.message)}songs=data||[];render();buildAllSuggestions()}
function render(){

    const q = $("search").value.trim().toLowerCase();
    const g = $("fgame").value.trim().toLowerCase();
    const ge = $("fgenre").value.trim().toLowerCase();

    const b = $("fbpm").value === ""
        ? null
        : Number($("fbpm").value);

    let list = songs.filter(s => {

        // タグを検索用の文字列にまとめる
        const artists = Array.isArray(s.artist_tags)
            ? s.artist_tags
            : [];

        const games = Array.isArray(s.game_tags)
            ? s.game_tags
            : [];

        const genres = Array.isArray(s.genre_tags)
            ? s.genre_tags
            : [];

        const memotags = Array.isArray(s.memo_tags)
            ? s.memo_tags
            : [];

        const allText = [
            s.title,
            ...artists,
            ...games,
            ...genres,
            ...memotags,
            s.memo
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        // 全体検索
        if(q && !allText.includes(q)){
            return false;
        }

        // 原作音ゲー検索
        if(
            g &&
            !games.some(tag =>
                String(tag).toLowerCase().includes(g)
            )
        ){
            return false;
        }

        // ジャンル検索
        if(
            ge &&
            !genres.some(tag =>
                String(tag).toLowerCase().includes(ge)
            )
        ){
            return false;
        }

        // BPM検索
        if(b != null){

            if(
                s.bpm_min == null &&
                s.bpm_max == null
            ){
                return false;
            }

            if(
                s.bpm_min != null &&
                b < Number(s.bpm_min)
            ){
                return false;
            }

            if(
                s.bpm_max != null &&
                b > Number(s.bpm_max)
            ){
                return false;
            }
        }

        return true;
    });

    $("count").textContent =
        `${list.length}曲 / ${songs.length}曲`;

    $("songs").innerHTML = "";

    if(!list.length){
        $("songs").innerHTML =
            '<div class="card">該当する楽曲がありません。</div>';
        return;
    }

    list.forEach(s => {

        const x = document.createElement("article");
        x.className = "song";

        // サムネイル
        const im = document.createElement("img");

        im.className = "thumb";
        im.src = s.thumbnail || "";
        im.alt = "";

        im.onerror = () => {
            im.style.visibility = "hidden";
        };

        // 本文
        const body = document.createElement("div");

        // 曲名
        const t = document.createElement("div");
        t.className = "title";
        t.textContent = s.title || "無題";

        body.append(t);

        // タグ
        const artists = Array.isArray(s.artist_tags)
            ? s.artist_tags
            : [];

        const games = Array.isArray(s.game_tags)
            ? s.game_tags
            : [];

        const genres = Array.isArray(s.genre_tags)
            ? s.genre_tags
            : [];

        const metaParts = [];

        if(artists.length){
            metaParts.push(
                `作曲者：${artists.join(" / ")}`
            );
        }

        if(games.length){
            metaParts.push(
                `🎮 ${games.join(" / ")}`
            );
        }

        if(genres.length){
            metaParts.push(
                `🎵 ${genres.join(" / ")}`
            );
        }

        metaParts.push(
            bpmText(s.bpm_min, s.bpm_max)
        );

        if(s.duration != null){
            metaParts.push(
                `⏱ ${duration(s.duration)}`
            );
        }

        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = metaParts.join("  |  ");

        body.append(m);

        // 詳細メモ
        if(s.memo){
            const z = document.createElement("div");

            z.className = "memo";
            z.textContent = s.memo;

            body.append(z);
        }

        // リンク
        if(s.url){
            const l = document.createElement("a");

            l.href = s.url;
            l.target = "_blank";
            l.rel = "noopener";
            l.textContent = "🔗 リンクを開く";

            body.append(l);
        }

        // ボタン
        const ac = document.createElement("div");
        ac.className = "actions song-actions";

        const ed = document.createElement("button");
        ed.className = "secondary";
        ed.textContent = "編集";
        ed.onclick = () => edit(s);

        const de = document.createElement("button");
        de.className = "danger";
        de.textContent = "削除";
        de.onclick = () => del(s);

        ac.append(ed, de);

        x.append(im, body, ac);

        $("songs").append(x);
    });
}
function edit(s){

    // 編集対象のID
    $("songId").value = s.id;

    // 曲名
    $("title").value = s.title || "";

    // 保存済みタグを読み込む
    tagState.artist = Array.isArray(s.artist_tags)
        ? [...s.artist_tags]
        : [];

    tagState.game = Array.isArray(s.game_tags)
        ? [...s.game_tags]
        : [];

    tagState.genre = Array.isArray(s.genre_tags)
        ? [...s.genre_tags]
        : [];

    tagState.memo = Array.isArray(s.memo_tags)
        ? [...s.memo_tags]
        : [];

    // タグを画面に表示
    renderTags("artist");
    renderTags("game");
    renderTags("genre");
    renderTags("memo");

    // タグ入力欄は空にする
    $("artistInput").value = "";
    $("gameInput").value = "";
    $("genreInput").value = "";
    $("memoInput").value = "";

    // その他の項目
    $("bpmMin").value = s.bpm_min ?? "";
    $("bpmMax").value = s.bpm_max ?? "";
    $("duration").value = s.duration ?? "";

    $("url").value = s.url || "";
    $("thumbnail").value = s.thumbnail || "";

    $("memo").value = s.memo || "";

    // 編集モード
    $("formTitle").textContent = "✏️ 曲を編集";
    $("save").textContent = "更新";

    $("cancel").classList.remove("hidden");

    // 候補も更新
    buildAllSuggestions();

    // 上まで移動
    scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
async function del(s){if(!confirm(`「${s.title}」を削除しますか？`))return;let{error}=await db.from("songs").delete().eq("id",s.id);if(error)return msg("listMsg","削除失敗："+error.message);load()}
["search","fgame","fgenre","fbpm"].forEach(id=>$(id).oninput=render);
["artist","game","genre","memo"].forEach(type => {
    $(type + "Input").addEventListener("input", () => {
        buildSuggestions(type);
    });
});
ui();
</script></body></html>
